<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','NanumGothic',sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker>
    <style>
      .box{fill:#f7f9fc;stroke:#5f6b7a;stroke-width:1.4;rx:10}
      .f9{fill:#eef4ff;stroke:#2f5bd1}
      .ocr{fill:#fff4e8;stroke:#c7641b}
      .t{fill:#1f2933}.s{fill:#52606d;font-size:11.5px}.h{font-weight:700;font-size:14px}
      .lane{fill:none;stroke:#cbd2d9;stroke-dasharray:4 4}
      .arrow{stroke:#5f6b7a;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- lane headers -->
  <text x="12" y="24" class="t h">① 데이터</text>
  <text x="12" y="42" class="s">합성 · seed 고정 · 재현 가능</text>
  <text x="218" y="24" class="t h">② 학습 — 학교 GPU pod</text>
  <text x="218" y="42" class="s">A100 MIG 1g.10gb (9.5GiB)</text>
  <text x="490" y="24" class="t h">③ 가중치 — Release</text>
  <text x="490" y="42" class="s">GitHub weights-2026-11-13</text>
  <text x="722" y="24" class="t h">④ WE-Meet 백엔드 적용</text>
  <text x="722" y="42" class="s">gpu_server · infer_ocr.py</text>
  <line x1="207" y1="52" x2="207" y2="340" class="lane"/><line x1="479" y1="52" x2="479" y2="340" class="lane"/><line x1="711" y1="52" x2="711" y2="340" class="lane"/>

  <!-- F9 row -->
  <text x="12" y="70" class="s">F9 자연어 대화 (함수 호출)</text>
  <rect x="12" y="78" width="184" height="104" class="box f9"/>
  <text x="22" y="100" class="t h">합성 대화 데이터</text>
  <text x="22" y="119" class="s">prepare_f9.py · 1,500건</text>
  <text x="22" y="136" class="s">train 1,185 · eval 315 행</text>
  <text x="22" y="153" class="s">도구 11개 · seed 42</text>
  <text x="22" y="170" class="s">v2 생성기 +10,000건 추가</text>

  <rect x="218" y="78" width="250" height="104" class="box f9"/>
  <text x="228" y="100" class="t h">Qwen3-4B QLoRA (4-bit, r=16)</text>
  <text x="228" y="119" class="s">train.sh → 3 epoch · 588 step · 6.4h</text>
  <text x="228" y="136" class="s">loss 0.036 · eval.sh 로 학습 전/후 채점</text>
  <text x="228" y="153" class="s">턴 정확도 33.2% → 77.7%</text>
  <text x="228" y="170" class="s">도구 선택 91.1% · 인자 88.4%</text>

  <rect x="490" y="78" width="210" height="104" class="box f9"/>
  <text x="500" y="100" class="t h">qwen3-4b-f9</text>
  <text x="500" y="119" class="s">adapter.zip — LoRA 54MB</text>
  <text x="500" y="136" class="s">merged-nf4.zip + .z01 — 2.4GB</text>
  <text x="500" y="153" class="s">베이스+어댑터 병합 4-bit</text>
  <text x="500" y="170" class="s">단독 서빙 (베이스 불필요)</text>

  <rect x="722" y="78" width="222" height="104" class="box f9"/>
  <text x="732" y="100" class="t h">gpu_server (Flask :8600)</text>
  <text x="732" y="119" class="s">OpenAI 호환 chat/completions</text>
  <text x="732" y="136" class="s">.env LLM_MAIN_BASE_URL 한 줄</text>
  <text x="732" y="153" class="s">F9_Chat_agent → 도구 호출</text>
  <text x="732" y="170" class="s">일정 미리보기 · 등록</text>

  <!-- OCR row -->
  <text x="12" y="216" class="s">한국어 문서 OCR</text>
  <rect x="12" y="224" width="184" height="104" class="box ocr"/>
  <text x="22" y="246" class="t h">SynthDoG-ko</text>
  <text x="22" y="265" class="s">합성 한국어 문서 이미지</text>
  <text x="22" y="282" class="s">naver-clova-ix (HF)</text>
  <text x="22" y="299" class="s">train 23,532장 · val 500장</text>
  <text x="22" y="316" class="s">parquet 85개 중 4개 사용</text>

  <rect x="218" y="224" width="250" height="104" class="box ocr"/>
  <text x="228" y="246" class="t h">Donut-base · 전체 미세조정</text>
  <text x="228" y="265" class="s">202M 파라미터 · train_ocr.sh</text>
  <text x="228" y="282" class="s">1 epoch · 1,471 step · 3.6h</text>
  <text x="228" y="299" class="s">1280×960 · bf16 · batch 2×8</text>
  <text x="228" y="316" class="s">CER 60.6% → 5.2% · 1-NED 95.3%</text>

  <rect x="490" y="224" width="210" height="104" class="box ocr"/>
  <text x="500" y="246" class="t h">donut-ocr-ko</text>
  <text x="500" y="265" class="s">model.zip — 321MB</text>
  <text x="500" y="282" class="s">bf16 safetensors + processor</text>
  <text x="500" y="299" class="s">+ tokenizer · run.json · train.log</text>

  <rect x="722" y="224" width="222" height="104" class="box ocr"/>
  <text x="732" y="246" class="t h">src/infer_ocr.py</text>
  <text x="732" y="265" class="s">available() · image_texts()</text>
  <text x="732" y="282" class="s">osenv.ocr 과 같은 인터페이스</text>
  <text x="732" y="299" class="s">→ 드롭인 교체</text>
  <text x="732" y="316" class="s">F1 needs_ocr · F11/F12 포스터</text>

  <!-- arrows -->
  <path d="M198,130 L216,130" class="arrow"/><path d="M470,130 L488,130" class="arrow"/><path d="M702,130 L720,130" class="arrow"/>
  <path d="M198,276 L216,276" class="arrow"/><path d="M470,276 L488,276" class="arrow"/><path d="M702,276 L720,276" class="arrow"/>

  <!-- footer -->
  <text x="12" y="362" class="s" data-span="1">코드는 목적별 브랜치: common(공통 src · gpu_server) · gpu/qwen3-4b(F9) · gpu/donut-ocr(OCR) · wemeet/f9-chat-integration(백엔드 패치)</text>
  <text x="12" y="382" class="s" data-span="1">pod 는 2026-11-13 까지만 사용 가능했고 그 뒤 소멸 — 재현은 아무 NVIDIA GPU(8GB 이상)에서 같은 명령으로 된다. 평가표: docs/eval/</text>
</svg>
